[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirium"
version = "0.11.0"
description = "Autonomous treasury and agentic-payments infrastructure for Stellar (x402 + MPP) — Python client"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Nirium Protocol", email = "niriumprotocol@gmail.com"}]
keywords = ["nirium", "stellar", "soroban", "defi", "agent", "autonomous", "treasury", "x402", "mpp", "agentic-payments", "usdc", "cetes", "etherfuse", "rwa"]
dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=13.0",
    "stellar-sdk>=11.0.0,<16.0.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langchain-core>=0.3.0",
]

[project.urls]
Homepage = "https://nirium.xyz"
Repository = "https://github.com/nirium-protocol/nirium-sdk"
Documentation = "https://nirium.xyz/docs"
"Bug Tracker" = "https://github.com/nirium-protocol/nirium-sdk/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
