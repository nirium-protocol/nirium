# There was no CI running packages/sdk's own tests before this - the repo's
# only prior workflow (test-verify-audit-cid.yml) is scoped exclusively to
# actions/verify-audit-cid/**. Added alongside x402Serve()'s guard feature
# (issue #91) so "tests passing in CI" is a real, checkable fact for this
# package going forward, not just a local run.
name: SDK Tests
on:
  pull_request:
    paths:
      - packages/sdk/**
      - .github/workflows/sdk-test.yml
  push:
    branches:
      - main
    paths:
      - packages/sdk/**
      - .github/workflows/sdk-test.yml
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # --legacy-peer-deps: @stellar/mpp@0.7.1 peer-requires
      # @stellar/stellar-sdk@^15.1.0 while this package pins ^16.3.0 (what
      # @x402/stellar needs) - a pre-existing mismatch, unrelated to this
      # workflow, not fixed here. No @stellar/mpp release accepts 16 yet.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - run: npm test
  # Issue #107: tests above run from the source tree, so they cannot see
  # packaging bugs (0.10.0 require() in ESM, 0.13.0 ERR_MODULE_NOT_FOUND, the
  # undeclared dependency fixed in #68). This packs the SDK, installs the
  # tarball into an empty project and imports it as ESM, CJS and TypeScript,
  # and fails if any *.test.* file would be published. No network beyond npm.
  clean-install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - run: node scripts/clean-install-check.mjs
