# Issue #224: scan every pull request for committed secrets and fail the
# check when gitleaks finds one. Runs the gitleaks CLI directly (pinned
# version, checksum-verified) instead of gitleaks/gitleaks-action, which
# needs a paid license key for repos owned by an organization.
# Only the PR's own commits are scanned (base..head), so old history does
# not block new PRs. Config and allowlist: .gitleaks.toml.
name: Secret Scan
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
