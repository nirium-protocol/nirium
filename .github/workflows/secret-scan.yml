# Issue #224: scan for committed secrets and fail the check when gitleaks finds one.
# Runs the gitleaks CLI directly (pinned version, checksum-verified) instead of
# gitleaks/gitleaks-action, which needs a paid license key for repos owned by an
# organization. Config: .gitleaks.toml. Reviewed findings: .gitleaksignore.
#
# Since 15 Nov 2026 it scans the WHOLE history on every PR and every push to main,
# not just the PR's own commits: a secret committed once and deleted later still
# ships in every clone, and the PR-only scan had never looked at what was already
# there. That first full scan found one real (testnet) seed, now listed and
# neutralized in .gitleaksignore; anything not listed there fails this job.
name: Secret Scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan full history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore .
