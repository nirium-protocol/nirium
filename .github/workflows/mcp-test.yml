# packages/mcp (published as nirium-mcp) exposes the Nirium SDK to AI assistants
# as MCP tools. This workflow runs the tool test suite on every change under
# packages/mcp/**, using the same Node version as the SDK workflow.
name: MCP Tests
on:
  pull_request:
    paths:
      - packages/mcp/**
      - .github/workflows/mcp-test.yml
  push:
    branches:
      - main
    paths:
      - packages/mcp/**
      - .github/workflows/mcp-test.yml
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - run: npm test
