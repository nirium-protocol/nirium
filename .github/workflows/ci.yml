name: CI — Build + Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build + test SDK, CLI, MCP, Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: SDK — install, build, test
        working-directory: packages/sdk
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm test

      - name: CLI — install, syntax check, test
        working-directory: packages/cli
        run: |
          npm install --legacy-peer-deps
          npm run prepublishOnly
          npm test

      - name: MCP — install, build
        working-directory: packages/mcp
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Python SDK — install (with test extras), test
        working-directory: packages/sdk-python
        run: |
          python -m pip install -e ".[test]"
          python -m pytest
