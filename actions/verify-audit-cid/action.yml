name: Verify Nirium Audit CID
description: Verify a Nirium audit CID hash and optional Stellar Ed25519 agent attestation.
author: Nirium

inputs:
  cid:
    description: IPFS CID for the Nirium audit document.
    required: true
  gateway:
    description: >-
      Single IPFS gateway base URL to use, overriding the default fallback
      list below. Values ending in /ipfs or /ipfs/ are used directly. Leave
      unset to use the default fallback chain, or set `gateways` for a
      custom one.
    required: false
    default: ""
  gateways:
    description: >-
      Comma- or newline-separated list of IPFS gateway base URLs to try in
      order, falling back to the next on any failure (HTTP error or
      timeout). Ignored if `gateway` is set. Defaults to Filebase's
      dedicated gateway, then ipfs.io, then dweb.link - in that order,
      because ipfs.io and dweb.link rate-limit their shared public
      gateways (HTTP 429) under load, while a dedicated gateway does not.
    required: false
    default: ""
  fail-on-error:
    description: Fail the workflow step when verification fails.
    required: false
    default: "true"

outputs:
  verified:
    description: "true when the document hash matches and no embedded agent signature is invalid."
  hash_match:
    description: "true when SHA-256(JSON.stringify(record)) matches content_sha256."
  signature_valid:
    description: "valid, invalid, or absent."
  signer:
    description: Stellar G... public key from the agent attestation, when present.
  content_sha256:
    description: Recomputed SHA-256 hash of the audit record.
  cid:
    description: Echo of the CID input.
  gateway:
    description: The gateway URL that actually answered (first one that worked, or the last one tried if all failed).
  error:
    description: Error detail when verification or fetch fails.

runs:
  using: node20
  main: dist/index.js
